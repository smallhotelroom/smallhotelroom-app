# File: .github/workflows/release.yml
# Version: 1.0.0
# Unified release pipeline: builds Desktop (Windows, macOS Universal, Linux) and Android APK
# in parallel on version tags (v*.*.*) or manual dispatch, then attaches the APK to the
# single draft GitHub Release created by Tauri to avoid duplicate drafts or race conditions.

name: Build & Release App (Desktop + Android)

on:
  workflow_dispatch:
    inputs:
      gradle_task:
        description: 'Android Gradle task to run'
        required: true
        default: 'assembleDebug'
        type: choice
        options:
          - assembleDebug
          - assembleRelease
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: read

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-24.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout App Repo into ./app
        uses: actions/checkout@v4
        with:
          path: app

      - name: Checkout smallhotelroom.github.io alongside ./app
        uses: actions/checkout@v4
        with:
          repository: smallhotelroom/smallhotelroom.github.io
          path: smallhotelroom.github.io

      - name: Checkout cancionesdejuan.github.io alongside ./app
        uses: actions/checkout@v4
        with:
          repository: cancionesdejuan/cancionesdejuan.github.io
          path: cancionesdejuan/cancionesdejuan.github.io

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install Linux System Dependencies (Ubuntu 24.04)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            librsvg2-bin \
            patchelf

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './app/src-tauri -> target'

      - name: Sync Tauri Version with package.json & Build Official DB
        working-directory: ./app
        env:
          SHR_OFFICIAL_DIR: ${{ github.workspace }}/smallhotelroom.github.io/src/contents/songs
          SHR_CANCIONESDEJUAN_DIR: ${{ github.workspace }}/cancionesdejuan/cancionesdejuan.github.io/src/contents/songs
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const tauriPath = "src-tauri/tauri.conf.json";
            if (fs.existsSync(tauriPath)) {
              const tauriConf = JSON.parse(fs.readFileSync(tauriPath, "utf8"));
              tauriConf.version = pkg.version;
              fs.writeFileSync(tauriPath, JSON.stringify(tauriConf, null, 2) + "\n");
            }
            const cargoPath = "src-tauri/Cargo.toml";
            if (fs.existsSync(cargoPath)) {
              const cargo = fs.readFileSync(cargoPath, "utf8");
              fs.writeFileSync(cargoPath, cargo.replace(/^version\s*=\s*"[^"]*"/m, `version = "${pkg.version}"`));
            }
          '
          npm ci
          npm run db:build

      - name: Build Tauri Desktop Bundles (.exe, .dmg, .deb, .AppImage)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./app
          tagName: v__VERSION__
          releaseName: 'Small Hotel Room v__VERSION__'
          releaseBody: 'Installers for Windows (.exe), macOS (.dmg), Linux (.deb / .AppImage), and Android (.apk).'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout App Repo into ./app
        uses: actions/checkout@v4
        with:
          path: app

      - name: Checkout smallhotelroom.github.io alongside ./app
        uses: actions/checkout@v4
        with:
          repository: smallhotelroom/smallhotelroom.github.io
          path: smallhotelroom.github.io

      - name: Checkout cancionesdejuan.github.io alongside ./app
        uses: actions/checkout@v4
        with:
          repository: cancionesdejuan/cancionesdejuan.github.io
          path: cancionesdejuan/cancionesdejuan.github.io

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Android Builder Image
        run: docker pull ghcr.io/smallhotelroom/smallhotelroom-android-builder:latest

      - name: Cache npm and Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.gradle
          key: android-build-${{ runner.os }}-${{ hashFiles('app/package-lock.json', 'app/android/gradle.properties', 'app/android/build.gradle', 'app/android/app/build.gradle') }}
          restore-keys: |
            android-build-${{ runner.os }}-

      - name: Build Android APK in Builder Container
        env:
          GRADLE_TASK: ${{ inputs.gradle_task || 'assembleDebug' }}
        run: |
          mkdir -p "${HOME}/.gradle" "${HOME}/.npm"
          docker run --rm \
            -v "${{ github.workspace }}/app:/app" \
            -v "${{ github.workspace }}/smallhotelroom.github.io:/smallhotelroom.github.io:ro" \
            -v "${{ github.workspace }}/cancionesdejuan/cancionesdejuan.github.io:/cancionesdejuan.github.io:ro" \
            -v "${HOME}/.gradle:/root/.gradle" \
            -v "${HOME}/.npm:/root/.npm" \
            -e SHR_OFFICIAL_DIR=/smallhotelroom.github.io/src/contents/songs \
            -e SHR_CANCIONESDEJUAN_DIR=/cancionesdejuan.github.io/src/contents/songs \
            -w /app \
            ghcr.io/smallhotelroom/smallhotelroom-android-builder:latest \
            bash -lc "
              set -e
              if [ -z \"\$(ls -A /root/.gradle/wrapper/dists 2>/dev/null)\" ] && [ -f /opt/gradle-dist/gradle-8.11.1-all.zip ]; then
                mkdir -p /root/.gradle/wrapper/dists/gradle-8.11.1-all/2qik7nd48slq1ooc2496pTF4i
                cp /opt/gradle-dist/gradle-8.11.1-all.zip /root/.gradle/wrapper/dists/gradle-8.11.1-all/2qik7nd48slq1ooc2496pTF4i/
              fi
              npm ci
              npm run db:build
              npm run build
              npx cap sync android
              cd android
              (./gradlew ${GRADLE_TASK} --build-cache --offline || ./gradlew ${GRADLE_TASK} --build-cache)
            "
          sudo chown -R "$(id -u):$(id -g)" "${HOME}/.gradle" "${HOME}/.npm" "${{ github.workspace }}/app"

      - name: Stage APK Artifact
        run: |
          mkdir -p artifacts
          RAW_TAG="${GITHUB_REF_NAME:-dev}"
          VERSION="${RAW_TAG#v}"

          if [ -f "app/android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp -v "app/android/app/build/outputs/apk/debug/app-debug.apk" "artifacts/Small.Hotel.Room_${VERSION}_universal-debug.apk"
          fi
          if [ -f "app/android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp -v "app/android/app/build/outputs/apk/release/app-release-unsigned.apk" "artifacts/Small.Hotel.Room_${VERSION}_universal-unsigned.apk"
          fi
          ls -lh artifacts/
        shell: bash

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build-${{ github.ref_name }}
          path: artifacts/*
          if-no-files-found: error

  attach-android-to-release:
    needs: [build-tauri, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04

    steps:
      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-build-${{ github.ref_name }}
          path: artifacts

      - name: Attach APK to Draft GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/*.apk
          draft: true
